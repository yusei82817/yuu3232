<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>検索結果ドメイン排除</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <h1>検索結果ドメイン排除</h1>

    <section>
      <h2>排除するドメインリスト</h2>
      <ul id="domainList" aria-live="polite"></ul>
      <p id="emptyMessage">登録されているドメインはありません。</p>
    </section>

    <section>
      <label for="domainInput">追加する排除ドメイン</label>
      <input id="domainInput" type="text" placeholder="example.com" autocomplete="off">
      <div class="buttons">
        <button id="addButton" type="button">排除決定</button>
        <button id="removeButton" type="button">排除撤回</button>
      </div>
      <p id="status" role="status"></p>
    </section>

    <section class="audio-settings">
      <h2>音声設定</h2>

      <div class="audio-mode">
        <span class="audio-mode-title">立体音響</span>
        <label class="switch" for="spatialAudioToggle">
          <input id="spatialAudioToggle" type="checkbox">
          <span class="slider" aria-hidden="true"></span>
        </label>
        <span id="spatialAudioState">OFF</span>
      </div>

      <div id="audioModeOptions" class="audio-mode-options" hidden>
        <label for="audioMode">立体音響モード</label>
        <select id="audioMode">
          <option value="3d">3D</option>
          <option value="8d-left">8D 左回り</option>
          <option value="8d-right">8D 右回り</option>
          <option value="8d-dual">8D Dual（左右逆回転）</option>
        </select>
      </div>
    </section>

    <section class="external-links">
      <h2>リンク</h2>
      <div class="link-buttons">
        <a href="hp.html" target="_blank" rel="noopener noreferrer">HPに移動する</a>
        <a href="https://youtube.com" target="_blank" rel="noopener noreferrer">YouTubeに移動する</a>
      </div>
    </section>

    <button id="playerTabButton" class="player-tab-button" type="button">プレイヤータブ表示</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
